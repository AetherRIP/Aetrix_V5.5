name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rls-guard:
    name: Public schema is closed to the Data API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aetrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AETRIX_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aetrix
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the engine
        run: pip install -e "backend[dev]"

      # The check is only meaningful if the database looks like Supabase: the
      # roles must exist, and something must actually grant them access, or the
      # migrations would pass whether or not they revoke anything.
      - name: Reproduce Supabase's Data API roles and default grants
        run: |
          python - <<'PY'
          import os

          import psycopg

          dsn = os.environ["AETRIX_TEST_DATABASE_URL"].replace("+psycopg", "")
          with psycopg.connect(dsn, autocommit=True) as connection:
              connection.execute("CREATE ROLE anon NOLOGIN")
              connection.execute("CREATE ROLE authenticated NOLOGIN")
              connection.execute("CREATE ROLE service_role NOLOGIN BYPASSRLS")
              connection.execute(
                  "ALTER DEFAULT PRIVILEGES IN SCHEMA public "
                  "GRANT ALL ON TABLES TO anon, authenticated, service_role"
              )
              connection.execute(
                  "ALTER DEFAULT PRIVILEGES IN SCHEMA public "
                  "GRANT ALL ON SEQUENCES TO anon, authenticated, service_role"
              )
          PY

      # `alembic upgrade head` runs from the session fixture in tests/conftest.py,
      # so the migrations are exercised exactly as a deployment would run them.
      - name: Fail if any public table is open to anon or authenticated
        working-directory: backend
        run: python -m pytest tests/integration/test_rls_guard.py -q -p no:cacheprovider
