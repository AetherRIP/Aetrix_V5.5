name: Deploy backend (production)

# Controlled production deployment of the FastAPI engine to arm-free-1.
#
# Runs only on a manual dispatch from main, and only after the `production`
# environment's reviewers approve the run. No pull request can reach it, and no
# push deploys automatically.
#
# Required repository/environment secrets:
#   SSH_PRIVATE_KEY  — the ED25519 private key authorised as `ubuntu` on the VM
#   SSH_KNOWN_HOSTS  — output of `ssh-keyscan -p 22 139.185.60.57`
# The key must have no passphrase for unattended use (a dedicated deploy key),
# or the job must be run by a maintainer who supplies one interactively.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA on main to deploy (empty = current main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  verify:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import check
        working-directory: backend
        run: python -c "import app.main"
      - name: Unit tests
        working-directory: backend
        env:
          AETRIX_AUTH__JWT_SECRET: ci-only-secret-not-used-in-production
          AETRIX_DATABASE__URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/aetrix
        run: python -m pytest tests/unit -q

  deploy:
    name: Deploy to arm-free-1
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://arm-free-1.tail06bb75.ts.net/health
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Build release artifact
        run: |
          set -euo pipefail
          rid="$(git rev-parse --short HEAD)"
          echo "RID=$rid" >> "$GITHUB_ENV"
          git archive --format=tar.gz -o "/tmp/release-$rid.tar.gz" HEAD backend

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload and activate
        run: |
          set -euo pipefail
          scp -q -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            "/tmp/release-$RID.tar.gz" ubuntu@139.185.60.57:/tmp/aetrix-bootstrap/release.tar.gz
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes ubuntu@139.185.60.57 \
            "sudo -n /opt/aetrix/deploy/aetrix-deploy.sh install '$RID' /tmp/aetrix-bootstrap/release.tar.gz && \
             sudo -n systemctl enable aetrix-api >/dev/null 2>&1 && \
             sudo -n /opt/aetrix/deploy/aetrix-deploy.sh activate '$RID'"

      - name: Verify public endpoint
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors \
            https://arm-free-1.tail06bb75.ts.net/health | tee /tmp/health.json
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors \
            https://arm-free-1.tail06bb75.ts.net/ready | tee /tmp/ready.json

      - name: Record release
        if: always()
        run: |
          {
            echo "### Backend deployment"
            echo ""
            echo "- release: \`$RID\`"
            echo "- commit: \`${{ inputs.ref || github.sha }}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
