name: Verify production deployment

# Cloudflare Pages builds `frontend/` from `main` through the GitHub integration.
# Cloudflare also publishes a check run named "Cloudflare Pages" for the exact
# commit it built, so this workflow waits on that check and then checks the public
# site. It does not deploy and needs no Cloudflare API credential of its own.
#
# The repository's automatic GITHUB_TOKEN only needs read access to checks.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: pages-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the live Pages build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_URL: https://aetrix.pages.dev
    steps:
      - name: Wait for the Cloudflare Pages check for this commit
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100"
          check=""

          for attempt in $(seq 1 80); do
            response=$(curl -fsS --retry 4 --retry-delay 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$api")

            if ! jq -e '.check_runs' >/dev/null <<<"$response"; then
              echo "::error::GitHub did not return check runs for ${GITHUB_SHA}."
              exit 1
            fi

            check=$(jq -c '
              [.check_runs[] | select(.name == "Cloudflare Pages")]
              | sort_by(.id)
              | last // empty
            ' <<<"$response")

            if [ -n "$check" ]; then
              status=$(jq -r '.status // "unknown"' <<<"$check")
              conclusion=$(jq -r '.conclusion // ""' <<<"$check")
              echo "Cloudflare Pages: status=${status} conclusion=${conclusion:-pending} (attempt ${attempt}/80)"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  break
                fi
                echo "::error::Cloudflare Pages did not deploy ${GITHUB_SHA} successfully."
                jq -r '.output.title // "Deployment failed", .output.summary // "", .details_url // ""' <<<"$check"
                exit 1
              fi
            else
              echo "Waiting for Cloudflare Pages to report a check for ${GITHUB_SHA} (attempt ${attempt}/80)."
            fi

            sleep 15
          done

          if [ -z "$check" ] || [ "$(jq -r '.status // ""' <<<"$check")" != "completed" ]; then
            echo "::error::Cloudflare Pages did not report a completed check for ${GITHUB_SHA} within 20 minutes."
            jq -r '.check_runs[] | "\(.name): \(.status) \(.conclusion // "")"' <<<"$response"
            exit 1
          fi

          echo "Cloudflare Pages deployed ${GITHUB_SHA} successfully: $(jq -r '.details_url // ""' <<<"$check")"

      - name: Smoke-test the public site
        shell: bash
        run: |
          set -euo pipefail

          for path in / /sign-in /legal /terms /privacy /cookies /acceptable-use /ai-disclosure /copyright /security /account-deletion; do
            code=$(curl -sSL --retry 4 --retry-delay 5 -o /tmp/aetrix-response.html -w '%{http_code}' "${PRODUCTION_URL}${path}")
            printf '%-24s %s\n' "$path" "$code"
            if [ "$code" != "200" ]; then
              echo "::error::${PRODUCTION_URL}${path} returned ${code} after redirects"
              exit 1
            fi
          done

          curl -fsSL --retry 4 --retry-delay 5 "${PRODUCTION_URL}/" -o /tmp/aetrix-home.html
          grep -q '<title>Aetrix V5.5' /tmp/aetrix-home.html || {
            echo "::error::The production home page is not the Aetrix application shell."
            exit 1
          }

          if grep -Eqi 'localhost:8000|127\.0\.0\.1:8000' /tmp/aetrix-home.html; then
            echo "::error::The production page references a loopback engine address."
            exit 1
          fi

          echo "Production smoke checks passed for ${GITHUB_SHA}."
