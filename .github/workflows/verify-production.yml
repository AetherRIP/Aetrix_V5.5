name: Verify production deployment

# Cloudflare Pages builds `frontend/` from `main` through the GitHub
# integration. This workflow does not deploy: it waits for the Pages deployment
# for the pushed commit and then checks the public site. Keeping deployment in
# one place prevents this workflow and the GitHub integration racing to publish
# different builds of the same commit.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with Cloudflare Pages read access
#   CLOUDFLARE_ACCOUNT_ID  - 02c57cead9762baa7ac2d44a10c93fdc

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/verify-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the live Pages build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://aetrix.pages.dev
    steps:
      - name: Wait for the Pages deployment for this commit
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required to verify the Pages deployment."
            exit 1
          fi

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/aetrix/deployments?per_page=50"
          deployment=""

          for attempt in $(seq 1 60); do
            response=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api")

            if ! jq -e '.success == true' >/dev/null <<<"$response"; then
              echo "::error::Cloudflare Pages did not return a successful deployment list."
              jq -r '.errors // empty' <<<"$response" || true
              exit 1
            fi

            deployment=$(jq -c --arg sha "$GITHUB_SHA" '
              [.result[]
                | select(.environment == "production")
                | select((.deployment_trigger.metadata.commit_hash // "") == $sha)]
              | sort_by(.created_on)
              | last // empty
            ' <<<"$response")

            if [ -n "$deployment" ]; then
              stage_status=$(jq -r '.latest_stage.status // "unknown"' <<<"$deployment")
              stage_name=$(jq -r '.latest_stage.name // "unknown"' <<<"$deployment")
              echo "Deployment ${stage_name}: ${stage_status} (attempt ${attempt}/60)"

              case "$stage_status" in
                success)
                  break
                  ;;
                failure|canceled|skipped)
                  echo "::error::Cloudflare Pages deployment did not succeed."
                  jq -r '.stages[]? | "stage=\(.name) status=\(.status)"' <<<"$deployment"
                  exit 1
                  ;;
              esac
            else
              echo "Waiting for Cloudflare Pages to register this commit (attempt ${attempt}/60)."
            fi

            sleep 15
          done

          if [ -z "$deployment" ]; then
            echo "::error::No production Pages deployment appeared for ${GITHUB_SHA} within 15 minutes."
            jq -r '.result[:5][] | "\(.created_on) \(.environment) \(.deployment_trigger.metadata.commit_hash // "unknown") \(.latest_stage.status // "unknown")"' <<<"$response"
            exit 1
          fi

          stage_status=$(jq -r '.latest_stage.status // "unknown"' <<<"$deployment")
          if [ "$stage_status" != "success" ]; then
            echo "::error::The Pages deployment for ${GITHUB_SHA} ended in ${stage_status}."
            jq -r '.stages[]? | "stage=\(.name) status=\(.status)"' <<<"$deployment"
            exit 1
          fi

          echo "Verified Pages deployment for ${GITHUB_SHA}: $(jq -r '.url // "URL not reported"' <<<"$deployment")"

      - name: Smoke-test the public site
        shell: bash
        run: |
          set -euo pipefail

          for path in / /sign-in /legal /terms /privacy /cookies /acceptable-use /ai-disclosure /copyright /security /account-deletion; do
            code=$(curl -sS --retry 4 --retry-delay 5 -o /tmp/aetrix-response.html -w '%{http_code}' "${PRODUCTION_URL}${path}")
            printf '%-24s %s\n' "$path" "$code"
            if [ "$code" != "200" ]; then
              echo "::error::${PRODUCTION_URL}${path} returned ${code}"
              exit 1
            fi
          done

          curl -fsS --retry 4 --retry-delay 5 "${PRODUCTION_URL}/" -o /tmp/aetrix-home.html
          grep -q '<title>Aetrix V5.5' /tmp/aetrix-home.html || {
            echo "::error::The production home page is not the Aetrix application shell."
            exit 1
          }

          if grep -Eqi 'localhost:8000|127\.0\.0\.1:8000' /tmp/aetrix-home.html; then
            echo "::error::The production page references a loopback engine address."
            exit 1
          fi

          echo "Production smoke checks passed for ${GITHUB_SHA}."
