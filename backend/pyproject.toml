[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aetrix-engine"
version = "0.1.0"
description = "Aetrix V5.5 correction engine — Phase 1 foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "PyJWT[crypto]>=2.9,<3",
    "cryptography>=43,<46",
    "httpx>=0.27,<1",
    "pymupdf>=1.24,<2",
    "pillow>=11,<13",
    "numpy>=2,<3",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
]
benchmark = [
    "sympy>=1.13,<2",
]

[project.scripts]
aetrix-api = "app.main:run"
aetrix-worker = "app.worker:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires AETRIX_TEST_DATABASE_URL (real PostgreSQL)",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]
