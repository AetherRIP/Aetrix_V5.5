# Aetrix V5.5 — reverse proxy in front of the API.
#
# Listens on loopback only: the sole public path is the Tailscale Funnel, which
# terminates TLS with the tailnet certificate and forwards to 127.0.0.1:8080.
# Port 8000 (uvicorn) is never reachable from outside this host.

server {
    listen 127.0.0.1:8080;
    server_name _;

    server_tokens off;
    autoindex off;

    # Exam scans are the largest legitimate body; enough headroom, not unlimited.
    client_max_body_size 60m;
    client_body_timeout 60s;

    # A whole-paper correction can run for minutes; the proxy must not cut it off.
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Interactive documentation is disabled in production builds; make sure a
    # future development build cannot leak it through this proxy either.
    location ~ ^/(docs|redoc) {
        return 404;
    }
}
